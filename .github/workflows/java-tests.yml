name: Java tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run unit tests
        run: mvn -B -ntp -Dtest=ProjectManagementServiceTest test
      - name: Package application
        run: mvn -B -ntp -DskipTests package
